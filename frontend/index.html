  <script>
    // Completely silence the Tailwind dev warning before it evaluates
    (function () {
      var origWarn = console.warn;
      console.warn = function () {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('cdn.tailwindcss.com') !== -1) {
          return;
        }
        origWarn.apply(console, arguments);
      };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              dark: '#060911',
              card: '#0c1322',
              surface: '#111b2e',
              border: '#1b2a47',
              accent: '#38bdf8',
              accentHover: '#0ea5e9'
            }
          }
        }
      }
    };

  <style>
    body {
      background-color: #060911;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .leaflet-container {
      background-color: #060911 !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    .leaflet-tile {
      filter: brightness(0.65) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important;
    }

    .leaflet-popup-content-wrapper {
      background-color: #0c1322 !important;
      color: #f8fafc !important;
      border: 1px solid #1b2a47 !important;
      border-radius: 0.75rem !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6) !important;
    }

    .leaflet-popup-tip {
      background-color: #0c1322 !important;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #060911;
    }

    ::-webkit-scrollbar-thumb {
      background: #1b2a47;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }
  </style>
